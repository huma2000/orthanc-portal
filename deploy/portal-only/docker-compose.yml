# =====================================================================
#  Orthanc Portal ONLY - for an Orthanc server you ALREADY have
#
#  This file starts just the portal. It does not start Orthanc and it does
#  not start a Cloudflare Tunnel. (For a complete new stack with its own
#  Orthanc, use ../docker-compose.yml instead.)
#
#  Usage (from this "portal-only" folder):
#     1. cp .env.example .env     and edit .env   (at least ORTHANC_URL)
#     2. docker compose up -d --build
#     3. Intranet:  http://<this-server>:8080   (INTRANET_PORT in .env)
#        Sign in as "admin". If you left ADMIN_PASSWORD empty, the generated
#        password is printed once:   docker compose logs portal
#     4. Settings > Orthanc connection > "Test connection" tells you at once
#        whether Orthanc accepts the portal (and how to fix it if it does not).
#
#  WITH OR WITHOUT AN ORTHANC ACCOUNT
#     * Orthanc has users                  -> set ORTHANC_USERNAME and ORTHANC_PASSWORD.
#     * Orthanc has NO users and only a    -> leave both EMPTY. The portal then sends no
#       list of allowed clients / IPs         credentials; Orthanc must simply accept the
#                                             machine the portal runs on (see below).
#     You can change this later from the web interface (Settings > Orthanc
#     connection); the values in .env are only used the first time the portal starts.
#
#  WHERE IS YOUR ORTHANC? set ORTHANC_URL accordingly
#     A. On another computer of the network   ORTHANC_URL=http://192.168.1.50:8042
#        Orthanc sees the connection coming from THIS server's LAN address
#        (Docker translates the container's address). Put that address in Orthanc's
#        allowed list.
#     B. On THIS computer (a service, or a   ORTHANC_URL=http://host.docker.internal:8042
#        container with port 8042 published)
#        Orthanc sees an address of Docker's private network (172.x.x.x), NOT
#        127.0.0.1: allow Docker's range (for example 172.16.0.0/12), or use option D.
#     C. A container of ANOTHER compose project on this computer
#        Join its Docker network: uncomment the "networks" lines below, put the
#        network's name (docker network ls) and use ORTHANC_URL=http://<its service>:8042
#        Orthanc sees the portal container's address on that network (172.x.x.x).
#     D. You need Orthanc to see the real address of this server (or 127.0.0.1)
#        Run the portal on the host's own network: delete the "ports:" block, add
#        "network_mode: host" to the portal service and use ORTHANC_URL=http://127.0.0.1:8042
#        (Linux only. The portal then listens directly on INTRANET_PORT / INTERNET_PORT
#        of this server: pick free ones in .env.)
#
#  Network design
#    * The portal listens on TWO ports:
#        8080  intranet, staff portal      -> published to the LAN (INTRANET_BIND)
#        8081  internet, INVITATIONS ONLY  -> published on this computer only
#                                             (INTERNET_BIND=127.0.0.1): point your own
#                                             Cloudflare Tunnel at http://localhost:8081
#      Whatever comes from the internet can only open the study an invitation link +
#      password was created for (no accounts, no search, nothing else).
#    * Port taken by another program? Set INTRANET_PORT / INTERNET_PORT in .env (and
#      point your tunnel at http://localhost:<INTERNET_PORT>).
#    * Never forward the intranet port (8080) to the internet.
# =====================================================================

services:
  portal:
    build:
      context: ../..           # project root (Dockerfile + src + static)
      dockerfile: Dockerfile
    image: orthanc-portal:latest
    restart: unless-stopped
    environment:
      # Where this compose file is: the update instructions (Settings > General) name it.
      PORTAL_COMPOSE_DIR: deploy/portal-only
      # INITIAL values only: after the first start, change them from the web
      # interface (sign in as admin > Settings). The saved values then win.
      # To go back to the values of this file once: RESET_SETTINGS: "true" (one start).
      ORTHANC_URL: ${ORTHANC_URL:?Set ORTHANC_URL in the .env file, e.g. http://192.168.1.50:8042}
      # Both EMPTY = connect to Orthanc WITHOUT an account (Orthanc trusts a list of clients/IPs).
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}       # empty = a random one is printed in the log
      # Listening ports: ALWAYS these (they are read-only in Settings > Network). The same
      # numbers are used inside the container and on this server, so option D works too.
      # Change INTRANET_PORT / INTERNET_PORT in .env, then: docker compose up -d
      BIND_ADDR: 0.0.0.0:${INTRANET_PORT:-8080}
      REMOTE_BIND_ADDR: 0.0.0.0:${INTERNET_PORT:-8081}
    volumes:
      - portal-data:/data                       # users, audit log and settings (BACK THIS UP)
      # Optional (README, section 9c): backups of the portal's database on this server, and a portable
      # viewer copied onto patient CDs. Uncomment, then enter /backups and /cd-viewer in Settings
      # (or set BACKUP_DIR / CD_VIEWER_DIR before the first start). The backup folder must be writable
      # by the container's user: sudo chown 10001 /srv/backups/portal
      # - /srv/backups/portal:/backups
      # - ./cd-viewer:/cd-viewer:ro
    ports:
      # staff portal (intranet)
      - "${INTRANET_BIND:-0.0.0.0}:${INTRANET_PORT:-8080}:${INTRANET_PORT:-8080}"
      # invitation links (for your tunnel)
      - "${INTERNET_BIND:-127.0.0.1}:${INTERNET_PORT:-8081}:${INTERNET_PORT:-8081}"
    # Lets "host.docker.internal" mean this computer on Linux too (option B above).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hardening. The only thing the portal writes is its database in /data.
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Option C: share the network of the compose project that runs Orthanc.
    # networks:
    #   - orthanc

# Option C (continued): the name of that existing Docker network.
# networks:
#   orthanc:
#     name: orthanc_default
#     external: true

volumes:
  portal-data:
