# =====================================================================
#  EVERYTHING: Orthanc (PACS, preconfigured) + Orthanc Portal + Cloudflare Tunnel
#
#  Already have an Orthanc? Use existing-orthanc/docker-compose.yml instead: portal +
#  Cloudflare Tunnel only, for an Orthanc with or without user accounts.
#
#  Usage (from this "deploy" folder):
#     1. Edit orthanc.json  -> change the "portal" password (RegisteredUsers)
#     2. cp .env.example .env   and fill it in:
#           ORTHANC_PORTAL_PASSWORD=<same password as in orthanc.json>
#           ADMIN_PASSWORD=<first portal administrator password, 10+ chars>
#           TUNNEL_TOKEN=<token of your Cloudflare Tunnel>   (see README)
#     3. docker compose up -d --build
#     4. Intranet:  http://<this-server>:8080     Internet: your Cloudflare hostname
#        (8080 = INTRANET_PORT in .env: change it there if another program uses it)
#     5. Sign in as admin, open Settings > Share links and type the public address
#        (e.g. https://pacs.example.com). Then use "Share..." on a study to invite
#        somebody outside: they get a link and a password for THAT study.
#
#  Network design
#    * Orthanc's web port 8042 is NOT published: only the portal reaches it.
#    * The portal listens on TWO ports:
#        8080  intranet, staff portal    -> published to the host (LAN users)
#        8081  internet, INVITATIONS ONLY -> NOT published; only the cloudflared
#                                           container reaches it over the Docker network
#      Both are set in .env (INTRANET_PORT / INTERNET_PORT); the portal uses the same
#      numbers inside the container, so Settings > Network shows the real ports.
#      so whatever comes from the internet can only open the study an invitation
#      link + password was created for (no accounts, no search, nothing else).
# =====================================================================

services:
  # ---- The PACS -------------------------------------------------------
  orthanc:
    # Official image that already includes the DICOMweb plugin (needed by Weasis).
    # Pin a specific version tag in production instead of "latest".
    image: jodogne/orthanc-plugins:latest
    restart: unless-stopped
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro   # configuration
      - orthanc-db:/var/lib/orthanc/db                # images + index (BACK THIS UP)
    ports:
      # DICOM protocol (C-STORE from scanners/modalities). Remove this line if
      # nothing sends images by DICOM. Keep it on the intranet only.
      # DICOM_PORT (.env) = the port scanners send to on this server.
      - "${DICOM_PORT:-4242}:4242"
      # 8042 (HTTP) intentionally NOT published.

  # ---- The portal (this project) --------------------------------------
  portal:
    build:
      context: ..            # project root (Dockerfile + src + static)
    restart: unless-stopped
    depends_on:
      - orthanc
    environment:
      # INITIAL values only: after the first start, change them from the web
      # interface (sign in as admin > Settings). The saved values then win.
      ORTHANC_URL: http://orthanc:8042          # "orthanc" = service name above
      ORTHANC_USERNAME: portal                  # must match RegisteredUsers in orthanc.json
      ORTHANC_PASSWORD: ${ORTHANC_PORTAL_PASSWORD:?Set ORTHANC_PORTAL_PASSWORD in the .env file, with the same value as the "portal" password in orthanc.json}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}       # empty = a random one is printed in the log
      # Listening ports: ALWAYS these (they are read-only in Settings > Network).
      # Change INTRANET_PORT / INTERNET_PORT in .env, then: docker compose up -d
      BIND_ADDR: 0.0.0.0:${INTRANET_PORT:-8080}
      REMOTE_BIND_ADDR: 0.0.0.0:${INTERNET_PORT:-8081}
      # RESET_SETTINGS: "true"                  # recovery: forget the settings saved from the web
    volumes:
      - portal-data:/data                       # users + audit log (BACK THIS UP)
    ports:
      # intranet access: http://<server>:<INTRANET_PORT>
      - "${INTRANET_BIND:-0.0.0.0}:${INTRANET_PORT:-8080}:${INTRANET_PORT:-8080}"
      # The internet port is deliberately NOT published: only cloudflared (same Docker network) uses it.

  # ---- Cloudflare Tunnel (internet access, no open inbound port) --------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # In the Cloudflare Zero Trust dashboard the tunnel's public hostname must point
    # to  http://portal:8081  (the invitation-links port = INTERNET_PORT, NOT the
    # intranet port). See README.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in the .env file (Cloudflare Zero Trust > Networks > Tunnels). For intranet only, remove the cloudflared service from this file}
    depends_on:
      - portal

volumes:
  orthanc-db:
  portal-data:
