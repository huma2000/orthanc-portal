[package]
name = "orthanc-portal"
version = "0.1.2"
edition = "2021"
description = "Web portal (intranet + Cloudflare Tunnel) for an Orthanc PACS with role-based permissions"

[dependencies]
# ---- Web framework -------------------------------------------------------
# axum: HTTP routing / extractors.  tokio: async runtime.
# http-body-util: lets the upload route enforce a size limit that can be changed
# at runtime from the Settings screen.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
http-body-util = "0.1"

# ---- Talking to Orthanc --------------------------------------------------
# reqwest: HTTP client used to call Orthanc's REST API.
#   * "stream"    -> lets us stream uploads/downloads without buffering them in RAM
#   * "rustls-tls"-> HTTPS support without depending on OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

# ---- Data handling -------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"   # builds the weasis:// URI

# ---- Users, passwords, sessions -------------------------------------------
# rusqlite (bundled): embedded SQLite database, no external DB server needed.
# argon2: modern password hashing.   rand: random session tokens.
rusqlite = { version = "0.43", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"

# ---- Email ---------------------------------------------------------------
# lettre: sends share invitations by email through the practice's SMTP server (Settings > Email).
# Only SMTP + rustls (the TLS stack reqwest already uses: no OpenSSL to install).
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }

# ---- Misc ----------------------------------------------------------------
thiserror = "2"          # ergonomic error enum
anyhow = "1"             # error handling in main()/config only
tracing = "0.1"          # logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"         # loads a local .env file (optional)
# gzip of the files built into the program (app.js, the translations...), done once at start-up.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# QR codes (SVG, drawn by the server) of invitation / upload links and of the two-step sign-in set-up.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Two-step sign-in (TOTP, RFC 6238: HMAC-SHA1, what every authenticator app uses) and the
# one-way hashes of its recovery codes (SHA-256).
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# Patient CD / USB export: copies the entries of Orthanc's DICOMDIR archive as they are (no
# recompression, hence no compression feature) next to a portable viewer.
zip = { version = "2", default-features = false }

[profile.release]
# Smaller, faster binary for production.
opt-level = 3
lto = "thin"
codegen-units = 1   # slower to compile, produces a smaller and faster program
strip = true
